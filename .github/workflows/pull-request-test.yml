name: Pull Request Test

# ワークフローレベルの paths は使わない。
# required status check にした場合、ワークフロー自体が起動しないと必須チェックが
# pending のまま完了せず PR がマージ不能になる。ジョブレベルの if: でスキップすれば
# 「skipped」＝成功扱いになるため、常に起動して中身だけスキップする形にする。
# 正本: .claude/rules/github-actions.md「パスフィルタの実装（重要な落とし穴）」
on:
    pull_request:
        branches: [main]

# 既定の広い権限に依存しない。個別に上乗せが要るジョブはジョブレベルで指定する。
permissions:
    contents: read

jobs:
    # 変更範囲を判定する。アプリに無関係な変更だけの PR では test をスキップする。
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # pull_request では変更ファイル一覧を GitHub API から取得するため必要。
            # これが無いと changes が落ち、needs: changes の test が丸ごとスキップされる。
            pull-requests: read
        outputs:
            app: ${{ steps.filter.outputs.app }}
            terraform: ${{ steps.filter.outputs.terraform }}
        steps:
            - uses: actions/checkout@v4

            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  # 除外条件は AND で結ぶ必要がある。既定の 'some' では
                  # NOT A OR NOT B となり、ほぼ全ファイルが true になる。
                  predicate-quantifier: 'every'
                  # 「対象リスト」ではなく「除外リスト」で書く。新しいディレクトリが
                  # 増えたときに黙ってテストが走らなくなるのを防ぐ（安全側に倒す）。
                  # extglob '!(a|b)' は picomatch で否定にならないため使わない。
                  filters: |
                      app:
                        - '!docs/**'
                        - '!**/*.md'
                        - '!.claude/**'
                        - '!terraform/**'
                        - '!architecture/**'
                      # 肯定パターンは every と AND になるため、1 本だけの filter に分ける
                      # （パターンが 1 本なら every でも some でも結果は同じ）。
                      terraform:
                        - 'terraform/**'

    test:
        needs: changes
        if: needs.changes.outputs.app == 'true'
        uses: ./.github/workflows/test.yml
        secrets: inherit

    # Terraform の静的検査。backend（共有 GCS バケット）には接続しないため認証不要。
    # state を触らない範囲で、構文・参照切れ・整形崩れを PR 時点で止める。
    terraform:
        needs: changes
        if: needs.changes.outputs.terraform == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform
        steps:
            - uses: actions/checkout@v4

            - uses: hashicorp/setup-terraform@v3

            - name: Terraform fmt / validate
              run: |
                  terraform fmt -check -recursive
                  terraform init -backend=false -input=false
                  terraform validate

    # required status check の受け皿。必ず起動し、単一の名前で結果を報告する。
    #
    # reusable workflow を呼ぶジョブは、報告されるチェック名が状況で変わる:
    #   実行された   → "test / test"（外側ジョブ / 内側ジョブ）
    #   スキップされた → "test"（内側が生成されないため外側だけ）
    # どちらを必須チェックに登録しても、もう一方のケースでそのチェックが
    # 存在せず pending のまま詰む。名前が変わらないジョブをここで用意する。
    test-result:
        needs: [changes, test, terraform]
        if: always()
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Check upstream job results
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  TEST_RESULT: ${{ needs.test.result }}
                  TERRAFORM_RESULT: ${{ needs.terraform.result }}
              run: |
                  echo "changes=$CHANGES_RESULT test=$TEST_RESULT terraform=$TERRAFORM_RESULT"

                  # changes が落ちると test は needs 未達でスキップされる。
                  # それを成功扱いにするとテストが 1 本も走らないまま通ってしまう。
                  if [ "$CHANGES_RESULT" != "success" ]; then
                      echo "::error::changes ジョブが success ではありません（$CHANGES_RESULT）。test が誤ってスキップされた可能性があります"
                      exit 1
                  fi

                  # skipped は「アプリに無関係な変更のみ」を意味するので成功扱いにする。
                  for pair in "test=$TEST_RESULT" "terraform=$TERRAFORM_RESULT"; do
                      case "${pair#*=}" in
                          success | skipped) ;;
                          *)
                              echo "::error::${pair%%=*} ジョブが ${pair#*=} で終了しました"
                              exit 1
                              ;;
                      esac
                  done
