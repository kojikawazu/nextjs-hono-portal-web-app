# 鍵・.env などの秘匿ファイルが Git 管理下に入っていないかを検査する。
# ルールの正本: .claude/rules/security.md「シークレット管理」/ .claude/rules/git.md「push 禁止」
#
# .gitignore は未追跡ファイルにしか効かない。一度追跡されたファイルには無視が
# 効かず、git add -f や新規ディレクトリでの書き漏れも止められない。さらに Git の
# 履歴は追記型で、一度 push した秘匿ファイルは追跡除外しても履歴に残る。公開
# リポジトリでは誰でも取得でき、対処は履歴の書き換えではなく鍵のローテーション
# しかなくなる。.gitignore の「混入させない」に加えて、「追跡された時点で落とす」
# 検出をここに置く。
name: secret-scan

# パスフィルタはかけない。git ls-files はインデックスを読むだけで数秒で終わる
# 一方、秘匿ファイルの混入はどの分類の変更でも起こりうる。必須チェックにした際に
# pending で詰まらせない意味もある（.claude/rules/github-actions.md 参照）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # git ls-files はインデックスを読むため checkout が要る（履歴は不要）。
      - uses: actions/checkout@v4

      - name: Assert no secret files are tracked
        run: |
          # サービスアカウント鍵は service-account.json / service_account.json /
          # serviceAccountKey.json と区切りが揺れる。キャメルケースだけを見ると
          # GCP で最も一般的な service-account.json を取りこぼす（issue #122）。
          #
          # grep は該当なしのとき終了コード 1 を返す。run: は bash -e で動くため、
          # || true が無いと「秘匿ファイルが 1 件も無い」正常ケースで代入の時点で
          # ステップが落ちる（成功すべき場合に失敗する）。
          tracked=$(git ls-files \
            | grep -E '(^|/)(\.env(\..+)?|[^/]+\.(key|pem|p12|pfx|jks|keystore|tfvars)|id_rsa|id_ed25519|id_dsa|credentials\.json|service[-_]?[Aa]ccount([-_]?[Kk]ey)?\.json)$' \
            | grep -vE '\.(example|sample|template|dist)$|\.env\.d\.ts$' \
            || true)

          if [ -n "$tracked" ]; then
            echo "::error::秘匿ファイルが Git 管理下にあります。.gitignore への追加や git rm --cached では履歴から消えないため、鍵・トークンのローテーションが必要になります。"
            echo "$tracked"
            exit 1
          fi

          echo "OK: 追跡対象に秘匿ファイルはありません"
