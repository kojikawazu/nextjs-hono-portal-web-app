name: Deploy to Cloud Run

on:
    push:
        branches:
            - main
        paths:
            - '.github/**'
            - 'front/**'

# 既定の広い権限に依存しない。GCP へのデプロイは credentials_json（SA キー）で
# 認証し GITHUB_TOKEN を使わないため、checkout 用の contents: read で足りる。
permissions:
    contents: read

# デプロイは cancel-in-progress: false にする（CI とは逆）。実行途中でキャンセル
# すると Cloud Run のリビジョン切り替えや古いイメージ削除が中断され、不整合が残る。
# 連続マージ時は後発が前発の完了を待つ。
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
  test:
        uses: ./.github/workflows/test.yml
        secrets: inherit

  deploy:
        needs: test
        runs-on: ubuntu-latest

        # 本番環境としてデプロイ履歴と URL を GitHub に記録する。
        # 承認ゲート（required reviewers）は置いていない（issue #113 の判断）。
        # シークレットは Environment ではなくリポジトリレベルのまま。test.yml が
        # PR で同じシークレットを使うため、Environment へ移すと PR の CI が落ちる。
        #
        # url は公開サイト（Cloudflare 経由）を指す固定値にする。Cloud Run の
        # 直 URL を gcloud から動的取得すると、サービス名・リージョンがシークレット
        # のため URL 全体がマスク対象になり、GitHub が environment_url を記録しない。
        # そもそも利用者が開くのは公開サイト側（issue #115）。
        environment:
            name: production
            url: https://smartportalcom.com/

        # アプリ本体は front/ に集約。.env 生成・docker build を front/ を基準に実行する
        defaults:
            run:
                working-directory: front

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate with Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

            - name: Authenticate Docker with GCR
              run: |
                  gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

            # 個別リダイレクトではなくグループにまとめて 1 回で書き出す（shellcheck SC2129）
            - name: Create file
              run: |
                  {
                    echo NODE_ENV=${{ secrets.NODE_ENV }}
                    echo ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}
                    echo BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}
                    echo GCS_PRIVATE_BUCKET_NAME=${{ secrets.GCS_PRIVATE_BUCKET_NAME }}
                    echo GCS_COMMON_DATA_PATH=${{ secrets.GCS_COMMON_DATA_PATH }}
                    echo GCS_PERSONAL_DATA_PATH=${{ secrets.GCS_PERSONAL_DATA_PATH }}
                    echo GCS_AIUSAGE_DATA_PATH=${{ secrets.GCS_AIUSAGE_DATA_PATH }}
                    echo MY_MAIL_ADDRESS=${{ secrets.MY_MAIL_ADDRESS }}
                    echo RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
                    echo RESEND_SEND_DOMAIN=${{ secrets.RESEND_SEND_DOMAIN }}
                    echo API_VALIDATE_SECRET_TOKEN=${{ secrets.API_VALIDATE_SECRET_TOKEN }}
                    echo API_SECRET_TOKEN=${{ secrets.API_SECRET_TOKEN }}
                    echo NEXT_PUBLIC_API_TOKEN=${{ secrets.NEXT_PUBLIC_API_TOKEN }}
                  } > .env

            - name: Setup Google Cloud SDK
              uses: google-github-actions/setup-gcloud@v2
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Build and push Docker image
              run: |
                  docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }} .
                  docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }}

            - name: Deploy to Cloud Run
              run: |
                  gcloud run deploy ${{ secrets.GCP_CLOUD_RUN_SERVICE_NAME }} \
                    --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }} \
                    --region ${{ secrets.GCP_REGION }} \
                    --platform managed \
                    --allow-unauthenticated

            - name: Cleanup old images
              run: |
                  IMAGE_NAME="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.REPO_NAME }}/${{ secrets.APP_NAME }}"
                  
                  # 更新日時の降順で一覧し、先頭 5 件（＝最新5つ）を除外した残りを削除する
                  gcloud artifacts docker images list ${IMAGE_NAME} --format="value(DIGEST)" --sort-by="~UPDATE_TIME" | tail -n +6 | while read -r DIGEST; do
                      if [[ ! -z "${DIGEST}" ]]; then
                          echo "Deleting old image: ${IMAGE_NAME}:${DIGEST}"
                          gcloud artifacts docker images delete "$IMAGE_NAME@$DIGEST" --quiet
                      fi
                  done
