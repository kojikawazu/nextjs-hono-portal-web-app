name: Test Workflow

on:
  workflow_call:

# 既定の広い権限に依存しない。実効権限は呼び出し元との積集合になる。
# checkout 用の contents: read だけで足りる。
permissions:
  contents: read

# テストはシークレットを一切使わない（GCP 認証も .env.test も不要）。
#   unit: 外部 I/O をモック / IT: jest.it.setup-env.js が fake-gcs-server 向けの値を注入
#   E2E : /api/gcs/* は page.route でモック、send-mail は送信前に止まるケースのみ
# 本番シークレットを渡すと、依存更新 PR（第三者のコード）が本番 SA キーを持って動く。
# Dependabot の PR にはシークレットが渡らず認証で必ず落ちていた（issue #161）。
# 呼び出し元も secrets: inherit を付けない。

jobs:
  test:
    runs-on: ubuntu-latest

    # アプリ本体は front/ に集約されているため、run ステップは front/ で実行する
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # フォーマット・lint・型チェックは install 直後に実行し、失敗時は後続の重いテストに進まない（fail fast）。
      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Lint (ESLint)
        run: pnpm run lint

      # ビルドとは別に型チェックを明示実行する（.claude/rules/static-analysis.md）。
      # ここが無いと型エラーは next build（= main マージ後のデプロイ）まで検出されない。
      # E2E は webServer が `pnpm dev` のため型エラーで止まらず、ESLint は型を見ない。
      - name: Type check (tsc)
        run: pnpm run typecheck

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm run test

      - name: Save Jest HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-report
          path: front/jest-report/

      # GCS 統合テスト（IT）: fake-gcs-server エミュレータを起動し、実 SDK で結合検証する
      - name: Start GCS emulator (fake-gcs-server)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run integration tests (IT)
        run: pnpm run test:it

      - name: Stop GCS emulator
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Run Playwright e2e tests
        run: pnpm run test:e2e

      - name: Save Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: front/playwright-report/
