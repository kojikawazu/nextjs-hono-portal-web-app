name: Test Workflow

on:
  workflow_call:

# 既定の広い権限に依存しない。実効権限は呼び出し元との積集合になる。
# GCP 認証は credentials_json（SA キー）で行い GITHUB_TOKEN を使わないため、
# checkout 用の contents: read だけで足りる。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # アプリ本体は front/ に集約されているため、run ステップは front/ で実行する
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # 個別リダイレクトではなくグループにまとめて 1 回で書き出す（shellcheck SC2129）
      - name: Create .env.test file
        run: |
          {
            echo NODE_ENV=${{ secrets.NODE_ENV }}
            echo ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}
            echo BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}
            echo GCS_PRIVATE_BUCKET_NAME=${{ secrets.GCS_PRIVATE_BUCKET_NAME }}
            echo GCS_COMMON_DATA_PATH=${{ secrets.GCS_COMMON_DATA_PATH }}
            echo GCS_PERSONAL_DATA_PATH=${{ secrets.GCS_PERSONAL_DATA_PATH }}
            echo GCS_AIUSAGE_DATA_PATH=${{ secrets.GCS_AIUSAGE_DATA_PATH }}
            echo MY_MAIL_ADDRESS=${{ secrets.MY_MAIL_ADDRESS }}
            echo RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            echo RESEND_SEND_DOMAIN=${{ secrets.RESEND_SEND_DOMAIN }}
            echo API_VALIDATE_SECRET_TOKEN=${{ secrets.API_VALIDATE_SECRET_TOKEN }}
            echo API_SECRET_TOKEN=${{ secrets.API_SECRET_TOKEN }}
            echo NEXT_PUBLIC_API_TOKEN=${{ secrets.NEXT_PUBLIC_API_TOKEN }}
          } >> .env.test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # フォーマット・lint・型チェックは install 直後に実行し、失敗時は後続の重いテストに進まない（fail fast）。
      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Lint (ESLint)
        run: pnpm run lint

      # ビルドとは別に型チェックを明示実行する（.claude/rules/static-analysis.md）。
      # ここが無いと型エラーは next build（= main マージ後のデプロイ）まで検出されない。
      # E2E は webServer が `pnpm dev` のため型エラーで止まらず、ESLint は型を見ない。
      - name: Type check (tsc)
        run: pnpm run typecheck

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm run test

      - name: Save Jest HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-report
          path: front/jest-report/

      # GCS 統合テスト（IT）: fake-gcs-server エミュレータを起動し、実 SDK で結合検証する
      - name: Start GCS emulator (fake-gcs-server)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run integration tests (IT)
        run: pnpm run test:it

      - name: Stop GCS emulator
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Run Playwright e2e tests
        run: pnpm run test:e2e

      - name: Save Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: front/playwright-report/

      - name: Remove .env.test file
        if: always()
        run: rm .env.test
